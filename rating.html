<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
<title>Рейтинг учеников</title>
</head>
<body>
  <!-- Шапка (полноразмерная единая плашка) -->
  <header class="top">
    <div class="top-left">
      <a href="index.html" class="brand-title">
        <span class="brand-dot"></span>
        <span>ПОРТАЛ ДОСТИЖЕНИЙ ЛИЦЕЯ</span>
      </a>
      <span class="user-badge" id="whoBadge">
        <span class="role-tag" id="whoRole">РЕЙТИНГ</span>
        <span id="who">Гостевой просмотр</span>
      </span>
    </div>
    <div class="top-right">
      <div id="ratingSyncBadge" class="sync-status-pill sync-online" onclick="Storage.openSyncModal()" title="Синхронизация между устройствами (Онлайн) • Нажмите для настроек" style="cursor:pointer;">БОТ LIVE</div>
      <a href="presentation.html" class="top-nav-btn" style="color:var(--gold); border-color:rgba(245,158,11,0.4);">📊 Презентация</a>
      <a id="backLink" href="student.html" class="top-nav-btn">← Мой кабинет</a>
      <a href="https://t.me/Hobbits22_bot" target="_blank" class="top-nav-btn">🤖 Telegram-бот</a>
      <button id="btnResetDemo" onclick="confirmReset()" class="top-nav-btn warning" hidden>↺ Сбросить демо</button>
      <button id="btnLogout" onclick="Auth.logout()" class="top-nav-btn danger">🚪 Выйти</button>
    </div>
  </header>

  <main class="wrap">
    <!-- Фильтры -->
    <section class="panel">
      <h2>01 // Фильтры рейтинга</h2>
      <div class="row">
        <!-- Категория -->
        <select id="filterCat">
          <option value="">Все категории</option>
          <option value="physics">Физика</option>
          <option value="math">Математика</option>
          <option value="informatics">Информатика</option>
          <option value="project">Проект</option>
          <option value="volunteering">Волонтёрство</option>
        </select>
        <!-- Класс (заполняется динамически) -->
        <select id="filterClass">
          <option value="">Все классы</option>
        </select>
        <!-- Период -->
        <input type="date" id="filterFrom" title="От">
        <input type="date" id="filterTo"   title="До">
        <!-- Кнопки -->
        <button onclick="render()">Применить</button>
        <button class="link" onclick="resetFilters()">Сбросить</button>
      </div>
    </section>

    <!-- Топ-10 -->
    <section class="panel">
      <h2>02 // Подиум лидеров (Топ-10)</h2>
      <div id="top10" class="top-cards"></div>
    </section>

    <!-- Полная таблица рейтинга -->
    <section class="panel">
      <h2>03 // Полный рейтинг лицея</h2>
      <div class="table-wrap">
        <table id="fullRating"></table>
      </div>
    </section>
  </main>

  <script src="data/seed.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/tilt.js"></script>
  <script src="js/transitions.js"></script>
  <script>
    // Авторизация: пускаем и ученика, и админа, и гостя для открытого рейтинга
    const user = Auth.current();

    // Экранирование HTML-спецсимволов, чтобы текст не ломал вёрстку
    const esc = s => String(s).replace(/[&<>"]/g,
      ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));

    // Названия категорий для отображения
    const CAT_LABELS = {
      physics: "Физика", math: "Математика", informatics: "Информатика",
      project: "Проект", volunteering: "Волонтёрство"
    };

    // Навигация зависит от роли
    (function setupNav() {
      const link = document.getElementById("backLink");
      const who = document.getElementById("who");
      const whoRole = document.getElementById("whoRole");
      const btnLogout = document.getElementById("btnLogout");

      if (!user) {
        link.href = "index.html";
        link.textContent = "← Войти в систему";
        if (who) who.textContent = "Гостевой просмотр";
        if (whoRole) whoRole.textContent = "ОТКРЫТЫЙ ДОСТУП";
        if (btnLogout) btnLogout.style.display = "none";
      } else if (user.role === "admin") {
        link.href = "admin.html";
        link.textContent = "← Админ-панель";
        if (who) who.textContent = user.name;
        if (whoRole) whoRole.textContent = "ЗАВУЧ";
        const btnReset = document.getElementById("btnResetDemo");
        if (btnReset) btnReset.hidden = false;
      } else {
        link.href = "student.html";
        link.textContent = "← Личный кабинет";
        if (who) who.textContent = `${user.name} (${user.class || ""})`;
        if (whoRole) whoRole.textContent = "ЛИЦЕИСТ";
      }
    })();

    function confirmReset() {
      if (confirm("Вы уверены, что хотите сбросить базу данных до начального состояния?")) {
        api.reset();
      }
    }

    // CSS-класс медали для карточки топ-10
    function medalClass(rank) {
      if (rank === 1) return "gold";
      if (rank === 2) return "silver";
      if (rank === 3) return "bronze";
      return "";
    }

    // Сбросить все фильтры и перерисовать
    function resetFilters() {
      document.getElementById("filterCat").value   = "";
      document.getElementById("filterClass").value = "";
      document.getElementById("filterFrom").value  = "";
      document.getElementById("filterTo").value    = "";
      render();
    }

    // Основная функция отрисовки
    function render() {
      // Имя пользователя в шапке
      const whoEl = document.getElementById("who");
      if (whoEl) {
        if (user) {
          whoEl.textContent = user.role === "admin" ? `${user.name} (Завуч)` : `${user.name} (${user.class || ""})`;
        } else {
          whoEl.textContent = "Гостевой просмотр";
        }
      }

      // Собрать фильтры из элементов формы
      const filters = {};
      const cat = document.getElementById("filterCat").value;
      if (cat) filters.category = cat;
      const cls = document.getElementById("filterClass").value;
      if (cls) filters.classFilter = cls;
      const from = document.getElementById("filterFrom").value;
      if (from) filters.from = from;
      const to = document.getElementById("filterTo").value;
      if (to) filters.to = to;

      // Получить отсортированный рейтинг из API
      const board = api.rating.leaderboard(filters);

      // Заполнить выпадающий список классов (сохраняя выбранное значение)
      const classSelect = document.getElementById("filterClass");
      const prevClass = classSelect.value;
      const classes = api.rating.classes();
      classSelect.innerHTML = '<option value="">Все классы</option>' +
        classes.map(c => `<option value="${esc(c)}"${c === prevClass ? " selected" : ""}>${esc(c)}</option>`).join("");

      // --- Топ-10: карточки с местом, именем, классом и баллами ---
      const top = board.slice(0, 10);
      document.getElementById("top10").innerHTML = top.length
        ? top.map(r => `
          <div class="top-card ${medalClass(r.rank)}">
            <div class="place">#${r.rank}</div>
            <div class="name">${esc(r.name)}</div>
            <div class="cls">${esc(r.class)}</div>
            <div class="pts">${r.total} б.</div>
          </div>`).join("")
        : '<p class="hint">Нет данных для отображения</p>';

      // --- Полная таблица рейтинга ---
      const headerRow = "<tr><th>Место</th><th>Имя</th><th>Класс</th><th>Баллы</th><th>Достижений</th></tr>";
      const bodyRows = board.map(r => {
        // Подсветить строку текущего пользователя (если авторизован)
        const isMeClass = (user && r.userId === user.id) ? ' class="me"' : "";
        return `<tr${isMeClass}>
          <td><b>#${r.rank}</b></td>
          <td><b style="color:var(--text-main)">${esc(r.name)}</b></td>
          <td>${esc(r.class)}</td>
          <td><b style="font-family:'Oswald',sans-serif;font-weight:700;color:var(--primary)">${r.total}</b></td>
          <td><span class="tag">${r.count}</span></td>
        </tr>`;
      }).join("");
      document.getElementById("fullRating").innerHTML = headerRow + bodyRows
        || headerRow + '<tr><td colspan="5" class="hint">Нет данных</td></tr>';
    }

    // Первичная отрисовка
    render();

    // Мгновенное обновление при синхронизации с сервером / ботом
    window.addEventListener('lyceum:db-synced', () => {
      render();
    });

    window.addEventListener('lyceum:server-status', (e) => {
      const badge = document.getElementById("ratingSyncBadge");
      if (!badge) return;
      if (e.detail && e.detail.online) {
        badge.textContent = "БОТ LIVE";
        badge.className = "sync-status-pill sync-online";
      } else {
        badge.textContent = "ОФФЛАЙН КЭШ";
        badge.className = "sync-status-pill sync-offline";
      }
    });
  </script>
</body>
</html>
